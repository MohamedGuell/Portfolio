<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="neonGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Circuit Grid Background Pattern -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
  </g>

  <!-- Circuit Traces with glowing nodes -->
  <g stroke="url(#neonCyan)" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 50 100 L 180 100 L 220 140 L 350 140" />
    <circle cx="50" cy="100" r="4" fill="#38bdf8" />
    <circle cx="350" cy="140" r="4" fill="#38bdf8" filter="url(#glow)" />

    <path d="M 750 350 L 620 350 L 580 310 L 450 310" />
    <circle cx="750" cy="350" r="4" fill="#38bdf8" />
    <circle cx="450" cy="310" r="4" fill="#38bdf8" filter="url(#glow)" />

    <path d="M 120 400 L 260 400 L 310 350 L 310 280" />
    <circle cx="120" cy="400" r="4" fill="#38bdf8" />

    <path d="M 680 50 L 540 50 L 490 100 L 490 170" />
    <circle cx="680" cy="50" r="4" fill="#38bdf8" />
  </g>

  <!-- Central Robot Chassis / Microcontroller Graphic -->
  <g transform="translate(400, 215)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="#0284c7" stroke-width="2" opacity="0.3" stroke-dasharray="6 6"/>
    <circle cx="0" cy="0" r="80" fill="#0f172a" stroke="url(#neonGold)" stroke-width="3" filter="url(#glow)"/>

    <!-- Robot Face / Hardware Elements -->
    <!-- Eyes / IR Sensors -->
    <rect x="-35" y="-30" width="22" height="16" rx="4" fill="#0284c7" />
    <rect x="13" y="-30" width="22" height="16" rx="4" fill="#0284c7" />
    <circle cx="-24" cy="-22" r="5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="24" cy="-22" r="5" fill="#38bdf8" filter="url(#glow)"/>

    <!-- Sensor Signal Beams -->
    <line x1="-24" y1="-30" x2="-24" y2="-52" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="24" y1="-30" x2="24" y2="-52" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Motor Driver / Circuit Chips -->
    <rect x="-28" y="2" width="56" height="24" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="0" y="18" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="1">L298 H-BRIDGE</text>

    <!-- Wheels on sides -->
    <rect x="-72" y="-25" width="14" height="50" rx="3" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <rect x="58" y="-25" width="14" height="50" rx="3" fill="#334155" stroke="#64748b" stroke-width="1"/>

    <!-- Tri Briques Colorées (Red, Green, Blue) -->
    <rect x="-32" y="36" width="16" height="14" rx="2" fill="#ef4444" />
    <rect x="-8" y="36" width="16" height="14" rx="2" fill="#22c55e" />
    <rect x="16" y="36" width="16" height="14" rx="2" fill="#3b82f6" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(400, 375)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" opacity="0.95" />
    <text x="0" y="5" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1.5">
      ROBOT AUTONOME DE TRI • PROJET ITER
    </text>
  </g>
</svg>
